name: TIRNAV Android APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Kodlarını İndir
        uses: actions/checkout@v4

      - name: Java (JDK) Ortamını Kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.5'

      - name: Proje Ayarlarını ve Namespace Tanımını Yapılandır
        run: |
          mkdir -p app/src/main/java
          
          # Eğer manifest yoksa basit bir tane oluşturalım ki paket adı okunsun
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.ykocaman.tirnav">' > app/src/main/AndroidManifest.xml
            echo '<application android:label="TIRNAV"></application></manifest>' >> app/src/main/AndroidManifest.xml
          fi

          # build.gradle dosyasına eksiksiz namespace ve sdk tanımlarını ekliyoruz
          echo "apply plugin: 'com.android.application'" > app/build.gradle
          echo "android {" >> app/build.gradle
          echo "    namespace 'com.ykocaman.tirnav'" >> app/build.gradle
          echo "    compileSdk 33" >> app/build.gradle
          echo "    defaultConfig {" >> app/build.gradle
          echo "        applicationId 'com.ykocaman.tirnav'" >> app/build.gradle
          echo "        minSdk 21" >> app/build.gradle
          echo "        targetSdk 33" >> app/build.gradle
          echo "        versionCode 1" >> app/build.gradle
          echo "        versionName '1.0'" >> app/build.gradle
          echo "    }" >> app/build.gradle
          echo "}" >> app/build.gradle
          
          # Kök ayarları
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'TIRNAV'" >> settings.gradle

      - name: Launcher ikonunu hazırla
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

          rsvg-convert \
            -w 192 \
            -h 192 \
            icon.svg \
            -o app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp \
            app/src/main/res/mipmap-hdpi/ic_launcher.png \
            app/src/main/res/mipmap-hdpi/ic_launcher_round.png

      - name: APK Derle ve Üret
        run: |
          gradle wrapper --gradle-version 7.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/TIRNAV.apk

      - name: APK Dosyasını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: TIRNAV
          path: app/build/outputs/apk/debug/TIRNAV.apk
          if-no-files-found: error
          retention-days: 1
          
