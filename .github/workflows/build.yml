name: TIRNAV Android APK Builder
on: push: branches: [ main, master ] workflow_dispatch:
jobs: build: runs-on: ubuntu-latest
steps:
  - name: Repo Kodlarını İndir
    uses: actions/checkout@v4

  - name: Java 17 Kur
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Android SDK Kur
    uses: android-actions/setup-android@v4
    with:
      packages: 'platform-tools'

  - name: Android SDK 33 ve Build Tools Kur
    run: |
      sdkmanager "platforms;android-33" "build-tools;33.0.2"

  - name: Gradle Wrapper Oluştur
    run: |
      gradle wrapper --gradle-version 7.5
      chmod +x gradlew

  - name: APK Derle
    run: |
      ./gradlew clean assembleDebug --no-daemon --stacktrace

  - name: APK Dosyasını Hazırla
    run: |
      mkdir -p output
      cp app/build/outputs/apk/debug/app-debug.apk output/TIRNAV.apk

  - name: APK'yı Kaydet
    uses: actions/upload-artifact@v4
    with:
      name: TIRNAV
      path: output/TIRNAV.apk
      if-no-files-found: error
      retention-days: 7
